[project]
name = "football-odds-service"
version = "0.1.0"
description = "Backend API for the Football Odds Service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # Oddschecker blocks plain HTTP requests site-wide via Cloudflare (see
    # docs/oddschecker-gw3-feasibility-spike.md); a real, JS-executing
    # browser is required to retrieve the fixture page. Free/local (no paid
    # scraping or proxy service) -- requires a one-time `playwright install
    # chromium` after installing dependencies.
    "playwright>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
